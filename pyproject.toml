[project]
name = "eda-teaching-notebook"
version = "0.1.0"
description = "Know Your Data: Exploring and Preparing Image Datasets at the Wildwood Farm Park"
requires-python = ">=3.12,<3.13"  # Colab's Python line; keep in step with SPEC.md › Environment
# Runtime deps = what the notebook imports. Prefer packages Colab preinstalls; pin to the Colab
# version recorded in SPEC.md › Environment so the smoke run sees what students see.
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "matplotlib==3.10.0",
    "pillow==11.3.0",
    "pycocotools==2.0.11",
    "opencv-python-headless==5.0.0.93",
    "scikit-image==0.25.2",
    "scikit-learn==1.6.1",
    "imagehash", # not in Colab: %pip install in 00_setup
    "ipywidgets==7.7.1",
    "umap-learn==0.5.12",
    "bokeh==3.8.2",
]

[dependency-groups]
dev = [
    "jupytext>=1.16",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "pytest>=8",
    "ruff>=0.6",
    "jupyterlab>=4",
    "markdown>=3.11.2",
    "markdownify>=0.13",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E402"]  # notebook sections import where they are taught

[tool.ruff.lint.isort]
known-first-party = ["build"]  # scripts/build.py; else a local build/ folder decides how imports sort

[tool.ruff.lint.per-file-ignores]
"sections/*.py" = ["F821", "F811", "E501"]  # names come from earlier sections (one shared kernel); E501: her box HTML

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
